 s.wardrobe ||= {plain:true,oldshoes:true};s.outfit ||= {clothes:'plain',coat:'none',shoes:'oldshoes',accessory:'none'};s.giftDays ||= {};
 s.dog ||= {adopted:false,hunger:75,mood:75,bond:0};s.dog.clean ??= 70;s.dog.energy ??= 80;s.dog.age ??= 0;s.dog.gear ??= '无';s.dog.records ||= [];

{id:'dog_adoption',title:'纸箱里的小狗',once:true,minDay:13,phase:2,loc:'alley',dog:false,weight:30,text:'雨停不久，你在巷边发现一个潮湿的纸箱。\n\n里面蜷着一只瘦瘦的小狗，抬头望向你。\n\n蓝信一走近，蹲下来看它。\n“喂，你自己都要人照顾，还捡一个？”\n他话是这么说，手却已经伸了过去。',choices:[{text:'认真说：我会照顾它的',reply:'“好啦好啦。”他把自己的外套垫进纸箱。\n你们决定叫它薯仔。',effect:{trust:2,fam:3},adopt:true},{text:'抱着小狗，抬头望他',reply:'他跟你对视了一会儿，投降似的笑了。\n“带回去啦，淋亲就麻烦。”\n你们决定叫它薯仔。',effect:{spark:2,fam:3},adopt:true},{text:'问：你真的不喜欢它吗？',reply:'“我几时讲过不钟意啊？”\n薯仔就这样成为城寨的新住客。',effect:{fam:4},adopt:true}]},
{id:'dog_slipper',title:'一只不见的拖鞋',cooldown:10,dog:true,loc:'home',weight:16,text:'蓝信一在屋里找了半天，终于发现薯仔叼着他的拖鞋趴在桌子下面。\n\n“喂，小坏蛋，放低！”\n薯仔的尾巴摇得更欢了。',choices:[{text:'抱起薯仔替它求情',reply:'蓝信一望着你俩，最后还是笑了。',effect:{dogBond:5,fam:2}},{text:'拿零食换回拖鞋',reply:'薯仔交出了战利品。蓝信一揉揉你的头发：“有办法喔。”',effect:{dogBond:4,trust:1}}]},
{id:'small_quarrel',title:'一件没说清的事',cooldown:24,minDay:20,phase:2,loc:'home',weight:7,text:'蓝信一今天回来得晚，原本答应带回来的东西也忘了。\n\n他似乎有些疲惫，随手把外套搭在椅背上。',choices:[{text:'说自己等了很久',reply:'他愣了一下：“……对不起嘛，今日真系忙。”\n他没有立即走开。',effect:{tension:4,trust:2,spark:1}},{text:'不提这件事，先给他倒水',reply:'他接过水，过了好一会儿自己想起约定。\n“哎呀，我忘记了。”',effect:{fam:3,tension:-2}},{text:'安静地继续画画',reply:'他看了你半晌，放低声音：“是不是嬲我啊？”',effect:{tension:7,spark:2},flag:'quiet_quarrel'}]},
{id:'make_up',title:'没说出口的和好',cooldown:12,minDay:12,loc:'home',stat:{tension:8},weight:24,text:'蓝信一在门外停了一会儿。\n\n“喂。”\n\n他晃了晃手里的纸袋，里面是你爱吃的点心。\n“买多咗，食唔食？”',choices:[{text:'接过来，说声谢谢',reply:'他松了口气，笑意又回到了脸上。',effect:{tension:-12,fam:2}},{text:'问他是不是特意买的',reply:'“梗系唔系啦。”他答得太快，反而可疑。',effect:{tension:-9,spark:3}}]},
{id:'four_care',title:'四仔的提醒',cooldown:15,minDay:5,loc:'market',npc:'four',weight:12,text:'你在街市碰见四仔，他看见你抱着的东西，有些无奈。\n\n“拿这么重，当心手。”',choices:[{text:'谢谢，分一点给他拿',reply:'四仔帮你把东西送到街口。',effect:{four:4,energy:5}},{text:'说自己还搬得动',reply:'他摇摇头，还是跟着走了一段。',effect:{four:2,trust:1}}]},
{id:'long_tea',title:'龙卷风的一杯茶',cooldown:15,minDay:3,loc:'barber',npc:'long',weight:13,text:'龙卷风把茶杯推到你跟前。\n\n“在这里住得惯吗？”',choices:[{text:'点头，说街坊都很好',reply:'他笑了笑，说城寨里的人会互相照应。',effect:{long:4,mood:4}},{text:'坦白说还有点不习惯',reply:'“慢慢来。”他没有催你，给茶杯添了热水。',effect:{long:3,trust:1}}]},
{id:'lok_arrives',title:'新来的年轻人',once:true,minDay:15,loc:'diner',weight:15,text:'茶餐厅里坐着一个不太熟悉的年轻人。\n\n他一个人吃饭，动作很快。十二少随口提到，他叫陈洛军。',choices:[{text:'朝他轻轻点头',reply:'陈洛军也点了点头，算是打过招呼。',effect:{lok:3}},{text:'继续低头吃东西',reply:'你没打扰他。后来你们还是在城寨里见过几次。',effect:{lok:1}}]},
{id:'shadow',title:'巷口的陌生面孔',cooldown:35,minDay:21,loc:'alley',weight:3,text:'巷口来了几个面生的人，提起“大老板”和王九的名字。\n\n街坊们的声音一下低了些。你隐约觉得，城寨外面并不总是太平。',choices:[{text:'先离开，告诉蓝信一',reply:'蓝信一听完，神色认真了些。\n“以后见到他们，唔好自己凑上去。”',effect:{trust:3,tension:2}},{text:'把听到的话记下来',reply:'你记下几个重要细节，晚些交给了龙卷风。',effect:{trust:2,long:3}}]},
{id:'evening_treat',title:'多出来的一份宵夜',cooldown:13,minDay:12,phase:1,loc:'home',slot:2,weight:14,text:'夜已经深了，蓝信一敲了敲门。\n\n“喂，买多咗一份，食唔食？”\n\n他手里的纸袋正冒着热气。',choices:[{text:'让他进来一起吃',reply:'你们坐在小桌旁，聊了些没什么要紧的话。',effect:{fam:3,spark:1,energy:5}},{text:'接过宵夜，认真道谢',reply:'“咁客气做咩。”他笑着摆摆手。',effect:{trust:2,fam:1}}]},
{id:'drawing',title:'素描本里的身影',cooldown:22,minDay:28,phase:3,loc:'roof',npc:'lan',weight:17,text:'蓝信一凑过来看你的素描本。\n\n“画我啊？”\n\n你摇摇头。\n\n“啧，还以为自己咁有魅力添。”',choices:[{text:'翻到之前偷偷画他的那一页',reply:'他安静了两秒，笑得有点不自然。\n“……画得几好。”',effect:{spark:5,fam:2},flag:'showed_drawing'},{text:'合上本子，不让他看',reply:'他举起双手后退，仍旧笑着：“好好好，唔睇。”',effect:{spark:2,fam:3}}]},
{id:'wind_rain',title:'夜雨与外套',cooldown:23,minDay:30,phase:3,loc:'home',slot:2,weather:'小雨',weight:20,text:'楼下传来熟悉的摩托车声。\n\n蓝信一推门进来，肩头全是雨水。\n“喂，有冇毛巾啊？”',choices:[{text:'拿毛巾替他擦头发',reply:'他本来还要说话，忽然安静下来。',effect:{spark:4,fam:2}},{text:'把干毛巾递给他',reply:'“多谢晒。”他擦着头发，顺手把热乎乎的点心放到桌上。',effect:{trust:2,fam:2}}]},
{id:'fishgirl_help',title:'鱼蛋档的小帮手',cooldown:14,loc:'fish',minDay:2,weight:22,text:'燕芬姐正忙得抽不开身。鱼蛋妹踮着脚拿竹签，差点把一整盒签子碰翻。\n\n“哎呀！”她抬起头，眼巴巴看着你。',choices:[{text:'帮她捡起来，再一起数好',reply:'鱼蛋妹抹了把汗：“多谢姐姐！”燕芬姐给你添了一串鱼蛋。',effect:{fishgirl:4,yanfen:2,mood:2}},{text:'先提醒她小心烫手',reply:'燕芬姐走过来检查了一下锅，夸你心细。',effect:{yanfen:4,fishgirl:1}}]},
{id:'seven_rice',title:'七记的午饭',cooldown:13,loc:'seven',minDay:3,weight:19,text:'阿七正翻着锅，一转身，看见你站在门边。\n\n“坐啦，今日有叉烧。”\n\n柜台上恰好还有最后一碗黯然销魂饭。',choices:[{text:'帮他把碗筷摆好',reply:'阿七盛饭时特意多放了两片叉烧。',effect:{ahchat:4,energy:6}},{text:'问问他这道饭怎么做',reply:'阿七神神秘秘地笑：“秘诀啊？下次先话你知。”',effect:{ahchat:3,mood:4}}]},
{id:'grape_errand',title:'提子的差事',cooldown:12,loc:'garage',minDay:4,weight:18,text:'提子抱着一摞纸箱，几乎看不见前面的路。\n\n“喂，小律，借过借过！”',choices:[{text:'主动帮他扶住纸箱',reply:'提子终于腾出手擦汗：“难怪信一哥夸你做事稳妥。”',effect:{grape:4,trust:1,energy:-3}},{text:'提醒他脚边有台阶',reply:'提子堪堪停住：“哗，好险！”',effect:{grape:3}}]},
{id:'clinic_bandage',title:'跌打馆的纱布',cooldown:16,loc:'clinic',minDay:5,weight:16,text:'四仔正替一位街坊换药，柜台上的纱布忽然不够用了。\n\n他抬头看你一眼，没多说什么。',choices:[{text:'把新的纱布递过去',reply:'四仔低声说了句“多谢”，做事仍一丝不苟。',effect:{four:4,trust:1}},{text:'到隔壁七记借一点干净布料',reply:'四仔摇头，找出另一卷备用纱布，提醒你伤口不能乱碰。',effect:{four:2,ahchat:1}}]},
{id:'tiger_tea',title:'庙街一盏茶',cooldown:19,minDay:7,loc:'temple',requiresNpc:'tiger',weight:16,text:'Tiger哥在桌边饮茶，十二少正低声说着什么。\n\n你路过，十二少先朝你招手。',choices:[{text:'安静打个招呼',reply:'Tiger哥略略点头，十二少给你让了张凳子。',effect:{tiger:2,twelve:2}},{text:'先问十二少最近忙不忙',reply:'十二少正要答，被Tiger哥看了一眼，笑着收了声。',effect:{twelve:3,tiger:1}}]},
{id:'dik_herbs',title:'狄秋的养生茶',cooldown:17,minDay:12,loc:'herbal',weight:15,text:'狄秋拎着保温杯，在药材铺前挑拣茶包。\n\n他看见你，随口问：“后生女，平日有冇照顾好自己？”',choices:[{text:'认真听他讲养生的道理',reply:'狄秋满意地笑笑，送你一小包甘草。',effect:{dik:4,mood:2}},{text:'说自己最近忙着跑腿',reply:'他叹道：“做事唔好太拼，身体要紧。”',effect:{dik:3,energy:3}}]},
{id:'market_trouble',title:'果栏的怪人',cooldown:28,minDay:18,loc:'fruit',weight:11,text:'果栏里堆着高高的木箱。一个戴墨镜、撑黑伞的人从里面走出来，笑得古怪。\n\n周围的伙计忽然安静下来。',choices:[{text:'低头离开，不惹麻烦',reply:'你绕开人群，回头时那把黑伞已经不见了。',effect:{mood:-2,energy:-2}},{text:'记住模样，回城寨提醒街坊',reply:'龙卷风听完神色凝重，叫你以后别独自靠近果栏。',effect:{long:2,trust:1,mood:-2},flag:'warned_fruit'}]},
{id:'frog_word',title:'后巷的传话人',cooldown:25,minDay:18,loc:'passage',weight:9,text:'一个叫蛙仔的男人急急从巷口钻过，像是在替什么人传消息。\n\n他看见你，眼神闪了一下。',choices:[{text:'假装没看见，继续走',reply:'他没有跟来。你心里仍觉得不大对劲。',effect:{mood:-1}},{text:'转去龙城发廊把事情说清楚',reply:'提子听完记在心上，叫你先不要到处乱跑。',effect:{grape:2,trust:1}}]},
{id:'lan_gift_callback',title:'旧磁带的声音',once:true,minDay:15,phase:2,flag:'gifted_lan_cassette',loc:'home',weight:22,text:'你回房间时，听见旧收音机旁传来熟悉的曲调。\n\n蓝信一随手敲着节拍，见你进来才抬眼。\n\n“喂，你上次送嗰盒带，几好听喎。”',choices:[{text:'坐下来听完这一首',reply:'他把旁边的位置空出来，没再说话。',effect:{spark:2,fam:3}},{text:'小声问他喜欢哪首',reply:'“你猜？”他懒洋洋笑了。',effect:{fam:4}}]},
{id:'new_dog_walk',title:'薯仔的第一次远行',once:true,minDay:17,dog:true,loc:'market',weight:20,text:'薯仔踩着街市潮湿的地面，闻闻这里，又闻闻那里。\n\n鱼蛋妹蹲下来朝它招手，薯仔马上撒着欢跑过去。',choices:[{text:'陪薯仔认识新朋友',reply:'鱼蛋妹逗得哈哈大笑，薯仔玩得很开心。',effect:{dogBond:5,dogMood:6,fishgirl:3}},{text:'先把薯仔牵好，别碰翻东西',reply:'燕芬姐夸你照顾得周到，还给薯仔留了一碗清水。',effect:{dogBond:3,yanfen:3,trust:1}}]},
{id:'boss_pressure',title:'不太平的生意',cooldown:35,minDay:24,loc:'market',weight:8,text:'街市里的摊主压低声音谈起果栏的势力。有人想把生意伸进城寨，龙卷风已经派人打听。',choices:[{text:'把听见的事情告诉信一',reply:'蓝信一听完点点头：“知道啦。这些事交给我，你别乱跑。”',effect:{trust:2,grape:1},flag:'told_lan_pressure'},{text:'先安抚受惊的摊主',reply:'摊主感激地给你倒了杯热茶。',effect:{yanfen:2,long:1}}]}

];
function maybeEvent(){if(s.pending)return;let available=EVENTS.filter(canEvent);if(!available.length)return;let forced=available.filter(e=>e.id==='first_errand'&&s.day<=2);if(forced.length){openEvent(forced[0]);return}if(Math.random()>.37)return;let list=available.map(e=>[e,e.weight||10]),total=list.reduce((n,x)=>n+x[1],0),r=Math.random()*total;let chosen=list.find(([,w])=>(r-=w)<=0)?.[0]||available[0];openEvent(chosen)}
function openEvent(ev){s.pending=ev.id;save();renderModal(`<div class="scene-kicker">城 寨 片 段 / ${H(stamp())}</div><h2>${H(ev.title)}</h2><p>${H(ev.text)}</p><hr class="divider"><div class="scene-kicker">你会怎样做？</div>${ev.choices.map((c,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(65+i)}. ${H(c.text)}</button>`).join('')}`,false);document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>resolveEvent(ev,+b.dataset.choice)))}
function resolveEvent(ev,i){let c=ev.choices[i];adjust(c.effect);if(c.flag)s.flags[c.flag]=true;if(c.adopt){s.dog.adopted=true;s.inv.dogfood=(s.inv.dogfood||0)+1}if(ev.once||ev.cooldown)s.seen[ev.id]=s.day;s.pending=null;feedback(`【${ev.title}】${c.reply}`);notifyPhase();save();render();renderModal(`<div class="scene-kicker">事 件 结 果</div><h2>${H(ev.title)}</h2><p>${H(c.reply)}</p><button class="choice" id="ack">继续这一天　→</button>`,false);$('#ack').onclick=closeModal}
function spend(){nextSlot();notifyPhase();save();render();maybeEvent()}
const ACTIONS={work:{name:'帮信一做事',detail:'报酬与信任 · 精力-12',fn(){if(s.energy<12)return false;s.energy-=12;s.skill+=rand(1,3);s.money+=rand(11,18);let met=s.npc.lan===s.location||s.location==='barber';adjust({trust:met?rand(1,3):1,fam:met?1:0});feedback(pick(['你帮忙整理了几份账目，又替街坊跑了一趟腿。事情不多，但都顺顺利利。','今天跑了几趟差事，鞋底都快磨热了。蓝信一忙着别的事，仍记得给你留了一杯茶。','你照着交代把东西归置整齐，拿到了今天的零用钱。']));return true}},wander:{name:'在城寨闲逛',detail:'偶遇街坊 · 精力-6',fn(){if(s.energy<6)return false;adjust({energy:-6,mood:rand(1,4)});let nearby=peopleHere();if(nearby.length){let id=pick(nearby);if(id==='lan')adjust({fam:1});else adjust({[id]:1});feedback(`你在${PLACES[s.location].name}晃了晃，碰见${NPCS[id].name}。你们聊了几句，又各自去忙了。`)}else feedback(pick(['街坊在门口闲聊。你走走停停，听了几句，又继续往前。','一只花猫从墙根蹿了过去。今天没碰到什么熟人。','有人在窗边放歌，你倚着栏杆听了一会儿。']));return true}},draw:{name:'画画与整理',detail:'心情+8 · 消耗半天',fn(){adjust({mood:8,energy:-3});if(s.inv.paper>0&&Math.random()<.3){s.inv.paper--;s.inv.sketch=(s.inv.sketch||0)+1;feedback('你在素描纸上画了一幅城寨街景，仔细收进了本子。获得「街景素描」。')}else feedback('你靠在窗边，慢慢画下城寨的屋檐和人影。时间不知不觉过去了。');return true}},rest:{name:'好好休息',detail:'精力+24 · 心情+4',fn(){adjust({energy:24,mood:4,tension:-1});feedback(pick(['你睡了个不算长的午觉。醒来时，窗外有人叫卖。','你留在房间里休息，听见楼下断断续续的笑声。','难得没有别的事情，你泡了杯茶，安静坐了一会儿。']));return true}},help:{name:'给街坊帮忙',detail:'随机结识NPC · 小额报酬',fn(){if(s.energy<9)return false;adjust({energy:-9,money:rand(3,11)});let ids=Object.keys(s.relations).filter(x=>x!=='lok'||s.day>=15);let id=pick(ids);adjust({[id]:rand(1,3)});feedback(`你替${NPCS[id].name}做了一点小事，对方认真道了谢，还塞给你一点辛苦钱。`);return true}},tea:{name:'去吃点东西',detail:'花费HK$8 · 精力+12',fn(){if(s.money<8)return false;adjust({money:-8,energy:12,mood:4});feedback('茶餐厅端来了热乎乎的食物。你坐在窗边，听街坊慢悠悠地谈天气。');return true}},dog:{name:'陪薯仔玩一会儿',detail:'宠物亲密+6 · 心情+5',fn(){if(!s.dog.adopted)return false;adjust({dogBond:6,dogMood:8,mood:5,energy:-4});feedback(pick(['薯仔追着一只布球跑了半天，最后倒在你脚边打呼噜。','你搔搔薯仔的下巴，它仰着肚皮，尾巴拍个不停。','薯仔绕着你跑了几圈，玩累了就把脑袋搁在你膝盖上。']));return true}}};
function runAction(id){if(s.pending)return;let a=ACTIONS[id];if(!a)return;if(!a.fn()){showToast('条件不足，换一件事做吧。');return}spend()}
function travel(id){if(!PLACES[id])return;s.location=id;save();render();showToast('已到：'+PLACES[id].name)}
function buy(id){let g=GOODS[id];if(!g||g.price<1)return;if(s.money<g.price){showToast('港币不够啦。');return}s.money-=g.price;if(g.type==='outfit')s.wardrobe[id]=true;else s.inv[id]=(s.inv[id]||0)+1;addLog(`【购物】在街市买了「${g.name}」，花费 HK$${g.price}。`);save();render();showToast('买到了：'+g.name)}
function useItem(id){let g=GOODS[id];if(!g||!s.inv[id])return;if(g.type==='memory'){showToast('这是留作纪念的东西。');return}if(g.type==='material'){showToast('画画时会自动使用素描纸。');return}if(g.type==='outfit'){tab='dress';render();showToast('请在「小律装扮」面板换装。');return}if(id==='ribbon'){if(!s.dog.adopted){showToast('还没遇见薯仔呢。');return}s.dog.bond=clamp(s.dog.bond+5);s.dog.mood=clamp(s.dog.mood+8);feedback('你替薯仔系上红色狗绳，它高兴得在原地转圈。')}else if(id==='dogfood'){if(!s.dog.adopted){showToast('还没遇见薯仔呢。');return}adjust({dogHunger:40,dogBond:2});feedback('薯仔几口吃掉了碗里的狗粮，仰头眼巴巴地看着你。')}else if(g.type==='food'){adjust(g.effect);feedback(`你吃掉了${g.name}，稍微恢复了精神。`)}else if(g.type==='gift'){tab='people';render();showToast('送礼请前往「人物」面板，选择附近的人物。');return}else{showToast('这件物品暂时不能使用。');return}s.inv[id]--;if(s.inv[id]<=0)delete s.inv[id];save();render();showToast('已使用：'+g.name)}
function giveGift(id,good){
 if(!atPlace(id)){showToast('对方现在不在你身边。');return}
 if(!s.inv[good]||s.inv[good]<1){showToast('背包里没有这件礼物。');return}
 if(s.giftDays[id]===s.day){showToast('今天已经送过礼物啦，明天再来吧。');return}
 const item=GOODS[good];if(!item||['outfit','dog','memory','food'].includes(item.type)){showToast('这件物品不能送人。');return}
 const favorite=(item.likes||[]).includes(id);let rise=favorite?rand(4,6):rand(1,3);
 if(id==='lan'){adjust({trust:favorite?2:1,fam:rise,spark:s.phase>=2&&favorite?1:0});if(good==='cassette')s.flags.gifted_lan_cassette=true}
 else adjust({[id]:rise});
 s.inv[good]--;if(s.inv[good]<=0)delete s.inv[good];s.giftDays[id]=s.day;
 let msg=`【送礼】你把「${item.name}」送给${NPCS[id].name}。${NPC_GIFT_REPLIES[id]||'对方道了谢。'}${favorite?'似乎正合对方心意。':''}`;
 feedback(msg);save();render();showToast('礼物送出去了');
}
function giftMenu(id){
 if(!atPlace(id)){showToast('对方不在身边；等遇到再送吧。');return}
 const list=Object.keys(s.inv).filter(x=>s.inv[x]>0&&GOODS[x]&&['gift','material'].includes(GOODS[x].type));
 if(s.giftDays[id]===s.day){showToast('今天已经送过礼物。');return}
 if(!list.length){showToast('背包里没有适合送人的礼物，去商店看看吧。');return}
 renderModal(`<div class="scene-kicker">人 情 往 来</div><h2>送礼给${H(NPCS[id].name)}</h2><p>只可赠送附近的人物；每天每人最多送一次。喜好不同，回应也不同。</p>${list.map(g=>`<button class="choice" data-gift="${g}">${H(GOODS[g].name)} × ${s.inv[g]}</button>`).join('')}`);
 document.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{closeModal();giveGift(id,b.dataset.gift)});
}
function dogAction(kind){

 if(kind==='bath'){if(!(s.inv.dogbath>0)){showToast('要先购买宠物皂。');return}if(d.energy<8){showToast('薯仔太累了，明天洗吧。');return}s.inv.dogbath--;if(!s.inv.dogbath)delete s.inv.dogbath;d.clean=clamp(d.clean+55);d.energy=clamp(d.energy-9);d.mood=clamp(d.mood-rand(1,5));msg='你费了好大劲才把薯仔洗干净。它甩了你一身水，跑到蓝信一脚边去了。'}

 if(!msg)return;addDogRecord(msg);feedback('【薯仔】'+msg);save();render();showToast('薯仔开心地摇着尾巴');
}
function wear(id){const good=GOODS[id]||STYLES[id];if(!good||!good.slot)return;
 if(!s.wardrobe[id]){showToast('还没拥有这件衣物。');return}
 if(good.slot==='none'){showToast('请选择具体穿搭格位。');return}
 s.outfit[good.slot]=id;feedback(`【小律装扮】换上了「${good.name}」。`);save();render();showToast('换装完成');

function unwear(slot){s.outfit[slot]=slot==='clothes'?'plain':slot==='shoes'?'oldshoes':'none';save();render();showToast('已换回日常搭配')}

function talkTo(id){if(!isActive(id)||['boss','wong','frog'].includes(id)){showToast('对方并不适合随意搭话。');return}if(s.npc[id]!==s.location){showToast('人不在这里。');return}if(s.energy<5){showToast('你有点累了。');return}adjust({energy:-5});if(id==='lan'){adjust({fam:rand(0,2),trust:rand(0,1)});let say=s.phase<2?['“事情做完啦？辛苦晒。”他懒洋洋地朝你摆手。','“又见面啦。”蓝信一笑笑，继续忙手上的事。']:s.phase<4?['“喂，小律，今日怎么这么得闲？”他笑着让出半张凳子。','“慢慢来啦，赶什么。”他伸手帮你扶住快掉下来的东西。']:['“找我啊？”他偏过头，笑得有点得意。','蓝信一看了你一会儿，忽然问：“食咗饭未？”'];feedback(pick(say))}else{adjust({[id]:rand(1,3)});let lines={long:'龙卷风给你倒了茶，问你最近在城寨住得习不习惯。',twelve:'十二少跟你说起今天听来的新鲜事，笑得很开心。',four:'四仔提醒你别太累，顺手递给你一杯水。',lok:'陈洛军安静听你说话，最后认真地点了点头。'};feedback(lines[id]||pick(NPC_IDLE[id]||[`${NPCS[id].name}和你点头打了招呼，又继续忙自己的事。`]))}spend()}
function skipDay(){if(s.pending)return;let count=0;while(count<3){if(s.slot===0){adjust({energy:-3,mood:1});addLog('【平静的一日】你照常吃饭、做事，偶尔听见街坊说笑。')}let was=s.day;nextSlot();count++;save();render();maybeEvent();if(s.pending)return;if(s.day!==was)break}feedback('这段时间没有特别的事。日子照常往前，城寨也自有它的热闹。');save();render()}

function render(){let here=peopleHere();let num=s.slot===0?'08:30':s.slot===1?'14:20':'21:10';$('#app').innerHTML=`<div class="topline"><span>九 龍 · 一 九 八 六</span><span>城 寨 的 日 子，慢 慢 過</span></div><header class="mast"><div><h1>九龍城寨<br>日常手帖</h1><small>THE WALLED CITY · LIFE NOTES</small></div><div class="stamp">此 間 有 人</div></header><div class="grid"><aside class="sidebar"><section class="panel"><div class="panel-head">今 日 記 事 <span>◌</span></div><div class="stats"><div class="stat"><span>日期</span><b>${H(date())}</b></div><div class="stat"><span>时辰</span><b>${SLOTS[s.slot]} ${num}</b></div><div class="stat"><span>天气</span><b>${H(s.weather)}</b></div><div class="stat"><span>港币</span><b>HK$ ${s.money}</b></div></div></section><section class="panel"><div class="panel-head">小 律 的 狀 態</div><div class="stats"><div class="stat"><span>精力</span><b>${s.energy}/100</b></div><div class="bar"><span style="width:${s.energy}%"></span></div><div class="stat"><span>心情</span><b>${s.mood>=70?'很好':s.mood>=40?'平静':'有点低落'}</b></div><div class="stat"><span>与蓝信一</span><b>${PHASES[s.phase].name}</b></div><div class="stat"><span>今日穿着</span><b>${H((GOODS[s.outfit.clothes]||STYLES[s.outfit.clothes]||{}).name||'日常')}</b></div>${s.dog.adopted?`<div class="stat"><span>薯仔</span><b>${s.dog.hunger<30?'肚子饿':'摇着尾巴'}</b></div>`:''}</div></section><section class="panel navpanel"><div class="panel-head">手 帖 目 錄</div><div class="nav">${[['life','日常'],['map','地图'],['people','人物'],['bag','背包'],['shop','商店'],['diary','日记'],['rumor','闲话'],['dog','薯仔'],['dress','装扮'],['settings','设置']].map(([id,name])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${name}</button>`).join('')}</div></section><section class="panel worldpanel"><div class="panel-head">街 坊 角 落</div><div class="world"><p>鱼蛋档、七记、跌打馆与庙街都在照旧运转。</p><p>你可以影响他们，却不能安排他们的一天。</p></div></section></aside><main class="main"><section class="panel">${renderBody(here)}</section></main></div><div class="footer">九 龍 城 寨 · 慢 慢 過 日 子　/　非官方同人作品</div>`;documen if(tab==='shop')return `<div class="detail"><div class="section-title">街 市 小 店 <span>余额 HK$${s.money}</span></div><p class="subtle">日常买卖，价钱采用游戏平衡值，不代表1980年代真实物价。</p><div class="goods-grid">${Object.entries(GOODS).filter(([,g])=>g.price>0).map(([id,g])=>`<div class="tile"><span class="label">HK$ ${g.price}</span><h3>${H(g.name)}</h3><p>${H(g.desc)}</p><button class="smallbtn" data-buy="${id}" ${s.money<g.price?'disabled':''}>买一件 ＋</button></div>`).join('')}</div><p class="notice">购物即时完成，不推进时间；给NPC送礼请进入人物面板。买过的衣服会永久收进衣柜。</p></div>`;
if(tab==='dog')return `<div class="detail"><div class="section-title">薯 仔 手 帖 <span>${s.dog.adopted?'家中小成员':'尚未相遇'}</span></div>${!s.dog.adopted?`<div class="scene"><h2>等待相遇</h2><p>城寨的巷子里，或许还藏着一只等待被捡回家的小狗。</p><p class="hint">随着你与蓝信一渐渐熟悉，某个下雨后的日子，它可能会出现。提示：关系进入「熟悉的自己人」以后，多去后巷走走。</p></div>`:`<div class="dogcard"><div class="dogface">🐕</div><div><span class="label">城寨居民 · 小狗</span><h2>薯仔</h2><p>已一起生活 ${s.dog.age+1} 天 · ${s.dog.gear==='无'?'还没有戴配件':s.dog.gear}</p><p class="subtle">爱吃、黏人，有时偷偷叼走蓝信一的拖鞋。</p></div></div>${dogMeter('饱食',s.dog.hunger)}${dogMeter('清洁',s.dog.clean)}${dogMeter('精力',s.dog.energy)}${dogMeter('心情',s.dog.mood)}${dogMeter('亲密',s.dog.bond)}<div class="section-title space-top">照 顾 薯 仔</div><div class="action-grid">${[['feed','喂狗粮','消耗狗粮×1'],['play','陪它玩','减少精力，增加亲密'],['bath','给它洗澡','消耗宠物皂×1'],['walk','带它散步','减少体力、增加亲密'],['rest','让它睡觉','恢复精力'],['gear','戴上配件','需要背包中的项圈或狗绳']].map(([id,name,detail])=>`<button class="action" data-dogact="${id}"><strong>${name}</strong><span>${detail}</span></button>`).join('')}</div><div class="section-title space-top">薯 仔 的 小 日 記</div>${s.dog.records.slice(0,18).map(v=>`<div class="diary-item"><time>${H(v.when)}</time>${H(v.text)}</div>`).join('')||'<p class="empty">还没有什么小故事。</p>'}`}</div>`;
if(tab==='dress')return `<div class="detail"><div class="section-title">小 律 的 衣 櫃 <span>衣服不会消耗</span></div><div class="outfit-card"><div class="outfit-figure">✿<div class="figure-inner">小<br>律</div></div><div><h3>今日的样子</h3>${Object.entries(OUTFIT_SLOTS).map(([slot,name])=>`<p><b>${name}：</b>${H((GOODS[s.outfit[slot]]||STYLES[s.outfit[slot]]||{name:'不佩戴'}).name)}</p>`).join('')}</div></div><p class="subtle">简单换装，不需要复杂操作。衣服、鞋与发饰买过之后就永久保留。以后可以为不同穿搭增加蓝信一或街坊的偶发评论。</p>${Object.entries(OUTFIT_SLOTS).map(([slot,name])=>`<div class="section-title space-top">${name}<button class="smallbtn" data-unwear="${slot}">恢复默认</button></div><div class="goods-grid">${Object.entries({...STYLES,...GOODS}).filter(([id,g])=>g.slot===slot&&s.wardrobe[id]).map(([id,g])=>`<div class="tile ${s.outfit[slot]===id?'selected':''}"><h3>${H(g.name)}</h3><p>${H(g.desc||'')}</p><button class="smallbtn" data-wear="${id}" ${s.outfit[slot]===id?'disabled':''}>${s.outfit[slot]===id?'穿着中':'换上'}</button></div>`).join('')||'<p class="empty">这里还没有衣物，去商店添几件吧。</p>'}</div>`).join('')}</div>`;
if(tab==='diary')return `<div class="detail"><div class="section-title">生 活 日 記 <span>最新在前</span></div>${s.diary.slice(0,70).map(v=>`<div class="diary-item"><time>${H(v.when)}</time>${H(v.text)}</div>`).join('')||'<div class="empty">日记还空着。</div>'}</div>`;
if(tab==='rumor')return `<div class="detail"><div class="section-title">城 寨 閒 話</div><p class="subtle">别人的日子也在继续。有些事情，你会从街坊口中听说。</p>${s.rumors.map(v=>`<div class="diary-item"><time>${H(v.when)}</time>${H(v.text)}</div>`).join('')||'<div class="empty">现在还没听到什么闲话，先度过一个时段吧。</div>'}</div>`;
return `<div class="detail settings"><div class="section-title">設 定 與 存 檔</div><p>当前进度：第 ${s.day} 天 · ${PHASES[s.phase].name}</p><p class="hint">游戏全程本地运行，没有账号、联网模型或付费API。进度保存在当前浏览器中。清理浏览器数据或使用隐私模式可能丢失存档，因此建议定期导出备份。</p><button class="smallbtn" data-export>导出存档（JSON）</button><button class="smallbtn" data-import>导入存档</button><button class="smallbtn" data-reset>重新开始</button><hr class="divider"><p class="hint">这是非官方个人同人试作，不隶属于电影制作方。适合非商业个人体验。</p></div>`}
function renderModal(html,closable=true){$('#modalRoot').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="事件">${closable?'<button class="close" id="closeModal" aria-label="关闭">×</button>':''}${html}</div></div>`;if(closable)$('#closeModal').onclick=closeModal}
function closeModal(){$('#modalRoot').innerHTML=''}
function showToast(msg){let old=$('.toast');if(old)old.remove();let div=document.createElement('div');div.className='toast';div.textContent=msg;document.body.appendChild(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),2800)}
function exportSave(){save();let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`九龙城寨日常存档-第${s.day}天.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);showToast('存档已导出，请妥善保存。')}
function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let file=input.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==VERSION||!Number.isInteger(data.day)||data.day<1||data.day>100000||!data.stats||!data.inv||!data.npc||!data.relations||!data.dog||!data.flags||!data.seen||!Array.isArray(data.diary)||!PLACES[data.location])throw Error('文件格式不符');s=data;upgradeSave();s.pending=null;save();tab='life';render();showToast('存档导入成功。')}catch(e){showToast('导入失败：请选用本游戏导出的JSON存档。')}};input.click()}
function resetSave(){renderModal(`<div class="scene-kicker">重 新 開 始</div><h2>要回到相遇的第一天吗？</h2><p>当前进度会被覆盖。可以先在设置中导出存档备份。</p><button class="choice" id="yesReset">确认重新开始</button><button class="choice" id="noReset">还是算了</button>`);$('#yesReset').onclick=()=>{s=fresh();upgradeSave();addLog('你被蓝信一带进了城寨。龙城发廊里人来人往，他指了指角落的凳子，让你先坐下。');save();tab='life';closeModal();render()};$('#noReset').onclick=closeModal}
load();render();
})();
</script></body></html>
